[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-control"
version = "0.1.3"
description = "SO101 dual-arm FK/IK, joint mapping, trajectories and RBT client"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
kinematics = ["pin==3.8.0", "cmeel-urdfdom==4.0.1", "cmeel-tinyxml2==10.0.0"]
legacy-placo = ["placo==0.9.25"]
rbt = ["rbt==0.8.0", "rbt-so101-dual==0.1.3"]

[project.urls]
Repository = "https://github.com/sunwen-me/so101-rbt-control"

[project.scripts]
so101-control = "so101_control.__main__:main"

[tool.setuptools.packages.find]
include = ["so101_control*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.md", "LICENSE.SO-ARM100"]

[tool.setuptools.data-files]
"share/so101-control" = ["README.md", "NOTICE.md"]
"share/so101-control/config" = ["config/board.json"]
"share/so101-control/config/urdf" = ["config/urdf/so101_new_calib.urdf"]
